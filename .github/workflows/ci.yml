name: CI

on:
  push:
    branches:
      - main

jobs: 
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install npm packages
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm run test