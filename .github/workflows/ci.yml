name: CI

on:
  push:
    branches:
      - master

jobs: 
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install npm packages
              run: npm install
              working-directory: frontend

            - name: Run lint
              run: npm run lint
              working-directory: frontend

            - name: Run tests
              run: npm run test
              working-directory: frontend

            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Docker and Push
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/devboard-frontend:latest

    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                go-version: '1.23'
                go-version-file: backend/go.mod
                cache-dependency-path: backend/go.sum

            - name: Run go fmt
              run: go fmt 
              working-directory: backend

            - name: Run go vet
              run: go vet 
              working-directory: backend

            - name: Run tests
              run: go test 
              working-directory: backend

            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build Docker and Push
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/devboard-backend:latest